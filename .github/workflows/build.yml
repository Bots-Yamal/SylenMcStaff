
name: Build SylenStaff

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar SylenStaff
        run: mvn clean package

      - name: Guardar SylenStaff.jar
        uses: actions/upload-artifact@v4
        with:
          name: SylenStaff
          path: target/SylenStaff-1.0.0.jar
